<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>战士大战僵尸 - 50关终极版(移动版)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#000;font-family:'Microsoft YaHei',sans-serif;overflow:hidden;position:fixed;width:100%;height:100%}
canvas{display:block}

/* UI */
#ui{position:fixed;top:0;left:0;right:0;padding:5px 8px;background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.3) 70%,transparent);display:flex;align-items:center;gap:8px;z-index:10;pointer-events:none}
#hp-wrap{display:flex;align-items:center;gap:3px}
#hp-icon{font-size:12px;filter:drop-shadow(0 0 3px #f00)}
#hp-outer{width:80px;height:10px;background:linear-gradient(180deg,#1a0000,#0d0000);border-radius:5px;overflow:hidden;border:1px solid #600;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
#hp-fill{height:100%;border-radius:5px;transition:width .12s;background:linear-gradient(180deg,#f44,#c00);box-shadow:0 0 5px #f004}
#hp-text{color:#f88;font-size:10px;font-weight:bold;min-width:24px}
#ammo{color:#ffe066;font-size:10px;font-weight:bold;text-shadow:0 0 4px #ff04}
#coins-d{color:#fc0;font-size:10px;font-weight:bold;text-shadow:0 0 4px #fc04}
#xp-d{color:#8cf;font-size:10px;font-weight:bold}
#score-wrap{margin-left:auto;text-align:right}
#score{color:#fff;font-size:11px;font-weight:bold;text-shadow:0 0 6px #fff2}
#wave-lbl{color:#f80;font-size:10px;text-shadow:0 0 4px #f804}

/* Shop button */
#shop-btn{position:fixed;top:5px;left:5px;width:36px;height:36px;background:rgba(0,0,0,.8);border:2px solid #fc0;border-radius:8px;z-index:20;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 8px #fc04;pointer-events:all;touch-action:manipulation}

/* Weapon bar */
#wpn-bar{position:fixed;top:5px;right:5px;display:flex;flex-direction:column;gap:3px;z-index:20;touch-action:manipulation}
.wb{background:rgba(0,0,0,.8);border:1px solid #333;border-radius:5px;padding:3px 6px;color:#aaa;font-size:9px;display:flex;align-items:center;gap:4px;pointer-events:all;touch-action:manipulation}
.wb.act{border-color:#ff0;color:#ff0;box-shadow:0 0 6px #ff04}
.wb.locked{opacity:.4}
.wb .wi{font-size:14px}

/* Skill bar */
#skill-bar{position:fixed;right:5px;bottom:120px;display:flex;flex-direction:column;gap:5px;z-index:20;touch-action:manipulation}
.sk-s{width:48px;height:48px;border-radius:8px;border:2px solid #333;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;font-size:8px;gap:1px;pointer-events:all;backdrop-filter:blur(4px);touch-action:manipulation}
.sk-s.ready{border-color:#f80;box-shadow:0 0 10px #f806}
.sk-s .si{font-size:18px}
.sk-s .sk{font-size:8px;color:#999;position:absolute;bottom:2px;right:3px}
.sk-s .cd{position:absolute;inset:0;border-radius:6px;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;color:#ff0;font-size:10px;font-weight:bold}

/* Joystick */
#joystick-zone{position:fixed;left:0;bottom:0;width:45%;height:55%;z-index:5;pointer-events:all}
#joystick-base{position:fixed;left:30px;bottom:30px;width:120px;height:120px;background:rgba(60,60,60,.5);border:3px solid rgba(100,100,100,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 0 15px rgba(0,0,0,.5)}
#joystick-thumb{position:absolute;width:50px;height:50px;background:radial-gradient(circle at 30% 30%,rgba(120,120,120,.9),rgba(60,60,60,.9));border:2px solid rgba(150,150,150,.8);border-radius:50%;transition:transform .05s;pointer-events:none;box-shadow:0 0 10px rgba(0,0,0,.5)}
#joystick-thumb.active{background:radial-gradient(circle at 30% 30%,rgba(150,150,150,.9),rgba(100,100,100,.9));border-color:rgba(200,200,200,.9);box-shadow:0 0 15px rgba(100,100,200,.5)}

/* Fire zone */
#fire-zone{position:fixed;right:0;bottom:0;width:55%;height:55%;z-index:5;pointer-events:all}
#fire-btn{position:fixed;right:25px;bottom:35px;width:70px;height:70px;background:radial-gradient(circle at 30% 30%,rgba(200,60,60,.9),rgba(120,30,30,.9));border:3px solid rgba(220,80,80,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:all;box-shadow:0 0 15px rgba(200,50,50,.4);z-index:6}
#fire-btn.active{background:radial-gradient(circle at 30% 30%,rgba(255,80,80,.9),rgba(180,50,50,.9));box-shadow:0 0 25px rgba(255,50,50,.6)}
#fire-btn span{color:#fff;font-size:10px;font-weight:bold;text-shadow:0 0 5px rgba(0,0,0,.8)}

/* Aim indicator */
#aim-ind{position:fixed;width:20px;height:20px;pointer-events:none;z-index:5;display:none}
#aim-ind::before,#aim-ind::after{content:'';position:absolute;background:rgba(255,255,255,.5)}

/* Boss bar */
#bb{position:fixed;top:42px;left:50%;transform:translateX(-50%);width:200px;z-index:10;pointer-events:none;display:none}
#bb-l{color:#f44;font-size:10px;text-align:center;margin-bottom:2px;text-shadow:0 0 4px #f004}
#bb-bg{height:8px;background:linear-gradient(180deg,#200,#100);border-radius:4px;overflow:hidden;border:1px solid #600}
#bb-f{height:100%;background:linear-gradient(180deg,#f44,#c00);border-radius:4px;transition:width .1s;box-shadow:0 0 5px #f004}

/* Effects */
#dmg-flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,.3));opacity:0;transition:opacity .1s}
#wave-ann{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);color:#f80;font-size:24px;font-weight:bold;text-shadow:0 0 15px #f80,0 0 30px #f004;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
#loot-notify{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,40,0,.9);border:2px solid #4f4;border-radius:8px;padding:5px 14px;color:#8f8;font-size:11px;z-index:10;pointer-events:none;display:none;text-align:center;backdrop-filter:blur(3px);box-shadow:0 0 15px #4f43}

/* Overlay */
#overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,0,0,.95),rgba(0,0,0,.98))}
#overlay h1{color:#f00;font-size:36px;text-shadow:0 0 30px #f00,0 0 60px #f004;margin-bottom:3px;letter-spacing:3px}
#overlay .sub{color:#ffb;font-size:13px;margin-bottom:20px;text-align:center;line-height:1.8}
#overlay button{background:linear-gradient(135deg,#c00,#600);color:#fff;border:2px solid #f44;padding:12px 40px;font-size:16px;border-radius:8px;cursor:pointer;font-family:inherit;box-shadow:0 4px 25px #f006,0 0 50px #f003;transition:all .2s;letter-spacing:2px;touch-action:manipulation}
#overlay button:hover{background:linear-gradient(135deg,#f00,#c00);transform:scale(1.06);box-shadow:0 4px 35px #f008,0 0 70px #f005}

/* Story panel */
#sp{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow-y:auto;padding:10px}
#sp .sb{max-width:500px;background:linear-gradient(135deg,#1a0808,#0a0404);border:2px solid #600;border-radius:12px;padding:20px;color:#eee;line-height:1.8;font-size:12px;box-shadow:0 0 40px #f002}
#sp .princess-avatar{width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 0 15px #f9a6,0 0 30px #f064;animation:princessGlow 2s ease-in-out infinite;position:relative;overflow:hidden}
#sp .princess-avatar::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%);pointer-events:none}
#sp .avatar-dark{box-shadow:0 0 20px #a4f6,0 0 40px #6008}
#sp .avatar-boss{width:100px;height:100px;font-size:52px;box-shadow:0 0 30px #f006,0 0 60px #a0f4;animation:bossGlow 1.5s ease-in-out infinite}
#sp .avatar-win{width:100px;height:100px;font-size:52px;box-shadow:0 0 30px #f9a8,0 0 60px #fc06;animation:winGlow 2s ease-in-out infinite}
@keyframes princessGlow{0%,100%{box-shadow:0 0 15px #f9a6,0 0 30px #f064}50%{box-shadow:0 0 25px #f9aa,0 0 50px #f088}}
@keyframes bossGlow{0%,100%{box-shadow:0 0 30px #f006,0 0 60px #a0f4}50%{box-shadow:0 0 40px #f00a,0 0 80px #a0f8}}
@keyframes winGlow{0%,100%{box-shadow:0 0 30px #f9a8,0 0 60px #fc06}50%{box-shadow:0 0 50px #f9ac,0 0 80px #fc0a}}
#sp h2{color:#f44;text-align:center;margin-bottom:10px;font-size:18px;text-shadow:0 0 8px #f004}
#sp .pt{text-align:center;font-size:48px;margin-bottom:6px;filter:drop-shadow(0 0 10px #f004)}
#sp button{background:linear-gradient(135deg,#900,#500);color:#fff;border:1px solid #a00;padding:9px 32px;font-size:14px;border-radius:6px;cursor:pointer;font-family:inherit;transition:all .15s;touch-action:manipulation}
#sp button:hover{background:linear-gradient(135deg,#c00,#800)}

/* Shop panel */
#shp{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:15px;overflow-y:auto;backdrop-filter:blur(5px)}
#shp h2{color:#fc0;font-size:20px;margin-bottom:3px;text-shadow:0 0 10px #fc04}
#shp .cn{color:#f80;font-size:12px;margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;width:100%;max-width:700px}
.si{background:linear-gradient(135deg,#1a1200,#0a0800);border:2px solid #443200;border-radius:8px;padding:10px;color:#ddd;cursor:pointer;transition:all .15s;touch-action:manipulation}
.si:hover:not(.dis){border-color:#f80;background:linear-gradient(135deg,#221800,#120c00);transform:translateY(-1px);box-shadow:0 3px 12px #f803}
.si.dis{opacity:.4;cursor:not-allowed}
.si h3{color:#fc0;font-size:12px;margin-bottom:3px}
.si p{font-size:9px;color:#999;margin-bottom:5px;line-height:1.5}
.si .pr{color:#f80;font-weight:bold;font-size:11px}
.si .lv{color:#88f;font-size:9px;float:right}
#shp-x{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;height:44px;padding:0 28px;border-radius:22px;background:rgba(180,0,0,.9);color:#fff;font-size:16px;border:2px solid #f44;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 0 12px #f004;line-height:1;touch-action:manipulation;pointer-events:all}
#shp-x:active{background:#c00;transform:translateX(-50%) scale(1.08);box-shadow:0 0 20px #f008}

/* Wave progress indicator */
#wave-progress{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:9px;color:#888;z-index:10;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dmg-flash"></div>
<div id="wave-ann"></div>
<div id="loot-notify"></div>
<div id="aim-ind"></div>

<div id="ui">
 <div id="hp-wrap"><span id="hp-icon">❤️</span><div id="hp-outer"><div id="hp-fill"></div></div><span id="hp-text">100</span></div>
 <span id="ammo">🔫 ∞</span>
 <span id="coins-d">🪙 0</span>
 <span id="xp-d">⭐ Lv1</span>
 <div id="score-wrap"><div id="score">得分: 0</div><div id="wave-lbl">第1波</div></div>
</div>

<button id="shop-btn" ontouchstart="mbShop();event.stopPropagation();" onclick="mbShop()">🛒</button>

<div id="wpn-bar">
 <div class="wb act" id="w0" ontouchstart="switchWpn(0);event.stopPropagation();" onclick="switchWpn(0)"><span class="wi">🔫</span><span id="w0n">手枪</span></div>
 <div class="wb locked" id="w1" ontouchstart="switchWpn(1);event.stopPropagation();" onclick="switchWpn(1)"><span class="wi">💥</span><span id="w1n">霰弹枪</span></div>
 <div class="wb locked" id="w2" ontouchstart="switchWpn(2);event.stopPropagation();" onclick="switchWpn(2)"><span class="wi">🚀</span><span id="w2n">火箭筒</span></div>
 <div class="wb locked" id="w3" ontouchstart="switchWpn(3);event.stopPropagation();" onclick="switchWpn(3)"><span class="wi">⚡</span><span id="w3n">激光炮</span></div>
 <div class="wb locked" id="w4" ontouchstart="switchWpn(4);event.stopPropagation();" onclick="switchWpn(4)"><span class="wi">🔱</span><span id="w4n">散弹炮</span></div>
</div>

<div id="skill-bar">
 <div class="sk-s" id="sk0" ontouchstart="mbSkill(0);event.stopPropagation();" onclick="mbSkill(0)"><span class="si">💥</span><span>冲击波</span><span class="sk">Q</span></div>
 <div class="sk-s" id="sk1" ontouchstart="mbSkill(1);event.stopPropagation();" onclick="mbSkill(1)"><span class="si">🔥</span><span>烈焰术</span><span class="sk">E</span></div>
 <div class="sk-s" id="sk2" ontouchstart="mbSkill(2);event.stopPropagation();" onclick="mbSkill(2)"><span class="si">🛡️</span><span>护盾</span><span class="sk">R</span></div>
 <div class="sk-s" id="sk3" ontouchstart="mbSkill(3);event.stopPropagation();" onclick="mbSkill(3)"><span class="si">⚡</span><span>极速</span><span class="sk">F</span></div>
</div>

<div id="joystick-zone">
 <div id="joystick-base">
  <div id="joystick-thumb"></div>
 </div>
</div>

<div id="fire-zone">
 <div id="fire-btn"><span>射击</span></div>
</div>

<div id="bb"><div id="bb-l">👑 Boss</div><div id="bb-bg"><div id="bb-f"></div></div></div>
<div id="wave-progress"></div>

<div id="overlay">
 <h1>⚔️ 战士大战僵尸</h1>
 <div class="sub">🌹 50关终极版<br>穿越5大区域，揭开玫瑰的真相<br>她真的是你想象中的那个人吗？</div>
 <button ontouchstart="startGame();event.stopPropagation();" onclick="startGame()" style="touch-action:manipulation">开始战斗</button>
</div>

<div id="sp" style="display:none">
 <div class="sb">
  <canvas class="princess-avatar" id="princess-avatar" width="80" height="80"></canvas>
  <div class="pt" id="s-pt">⚔️</div>
  <h2 id="s-tl">??</h2>
  <div id="s-tx">...</div>
 </div>
 <button id="s-bn" ontouchstart="closeStory();event.stopPropagation();" onclick="closeStory()">继续战斗</button>
</div>

<button id="shp-x" ontouchstart="closeShop();event.stopPropagation();" onclick="closeShop()" style="display:none">✕ 关闭商店</button>
<div id="shp" style="display:none">
 <h2>⚔️ 升级商店</h2>
 <div class="cn" id="shp-c">🪙 0</div>
 <div class="sg" id="shp-g"></div>
</div>

<script>
const W=window.innerWidth,H=window.innerHeight;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=W;cv.height=H;

// ===== 绘制卡通女主角 =====
function drawPrincessAvatar(canvasEl,type){
  const c=canvasEl.getContext('2d'),s=canvasEl.width;
  c.clearRect(0,0,s,s);
  const cx2=s/2,cy2=s/2+2;
  let bg1,bg2;
  if(type==='warrior'){bg1='#a4f';bg2='#88f';}
  else if(type==='win'){bg1='#f9a';bg2='#f0f';}
  else if(type==='boss'){bg1='#600';bg2='#300';}
  else if(type==='skull'){bg1='#400';bg2='#200';}
  else if(type==='dark'){bg1='#600';bg2='#400';}
  else if(type==='zombie'){bg1='#484';bg2='#282';}
  else if(type==='crown'){bg1='#a4f';bg2='#408';}
  else if(type==='broken'){bg1='#a00';bg2='#500';}
  else if(type==='fire'){bg1='#f80';bg2='#a40';}
  else if(type==='night'){bg1='#222';bg2='#000';}
  else{bg1='#f9a';bg2='#f06';}
  const bg=c.createRadialGradient(cx2-4,cy2-4,0,cx2,cy2,s/2);
  bg.addColorStop(0,bg1);bg.addColorStop(1,bg2);
  c.fillStyle=bg;c.beginPath();c.arc(cx2,cy2,s/2,0,Math.PI*2);c.fill();
  const fy=cy2-2,fr=s*.32;
  const fg=c.createRadialGradient(cx2-3,fy-2,0,cx2,fy,fr);
  if(type==='zombie'){fg.addColorStop(0,'#8b8');fg.addColorStop(0.7,'#5a5');fg.addColorStop(1,'#383');}
  else if(type==='boss'){fg.addColorStop(0,'#d8a0b0');fg.addColorStop(0.7,'#b07088');fg.addColorStop(1,'#804060');}
  else{fg.addColorStop(0,'#ffe4d4');fg.addColorStop(0.7,'#f5c9b0');fg.addColorStop(1,'#e0a888');}
  c.fillStyle=fg;c.beginPath();c.arc(cx2,fy,fr,0,Math.PI*2);c.fill();
  const hairColor=type==='boss'?'#2a0a1a':type==='zombie'?'#2a4a2a':type==='dark'||type==='night'?'#1a1a2a':'#8a3050';
  c.fillStyle=hairColor;
  c.beginPath();c.arc(cx2,fy-3,fr+2,Math.PI+0.2,Math.PI*2-0.2);c.fill();
  if(type!=='zombie'){
    c.beginPath();c.moveTo(cx2-fr+3,fy-2);c.quadraticCurveTo(cx2-fr*.4,fy+3,cx2-2,fy+5);c.lineTo(cx2-fr*.5,fy-6);c.closePath();c.fill();
    c.beginPath();c.moveTo(cx2+fr-3,fy-2);c.quadraticCurveTo(cx2+fr*.4,fy+3,cx2+2,fy+5);c.lineTo(cx2+fr*.5,fy-6);c.closePath();c.fill();
  }
  c.fillStyle=hairColor;
  c.beginPath();c.moveTo(cx2-fr+4,fy+4);c.quadraticCurveTo(cx2-fr-4,fy+fr+4,cx2-fr+2,cy2+s*.3);c.quadraticCurveTo(cx2-fr+8,fy+fr+2,cx2-fr+10,fy+6);c.closePath();c.fill();
  c.beginPath();c.moveTo(cx2+fr-4,fy+4);c.quadraticCurveTo(cx2+fr+4,fy+fr+4,cx2+fr-2,cy2+s*.3);c.quadraticCurveTo(cx2+fr-8,fy+fr+2,cx2+fr-10,fy+6);c.closePath();c.fill();
  if(type!=='zombie'&&type!=='skull'&&type!=='night'){
    c.fillStyle='#e8305a';c.beginPath();c.arc(cx2-fr*.7,fy-fr*.5,5,0,Math.PI*2);c.fill();
    c.fillStyle='#f06080';c.beginPath();c.arc(cx2-fr*.7-2,fy-fr*.5-2,3,0,Math.PI*2);c.fill();
    c.fillStyle='#c02040';c.beginPath();c.arc(cx2-fr*.7+1,fy-fr*.5+2,3,0,Math.PI*2);c.fill();
    c.fillStyle='#2a8a3a';c.beginPath();c.ellipse(cx2-fr*.7+5,fy-fr*.5+2,4,2,.5,0,Math.PI*2);c.fill();
  }
  if(type==='boss'||type==='dark'||type==='night'){
    c.fillStyle=type==='boss'?'rgba(255,0,60,0.9)':'rgba(160,100,255,0.9)';
    c.shadowColor=type==='boss'?'#f00':'#a4f';c.shadowBlur=8;
    c.beginPath();c.ellipse(cx2-6,fy,4.5,5.5,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx2+6,fy,4.5,5.5,0,0,Math.PI*2);c.fill();
    c.shadowBlur=0;
    c.fillStyle='#fff';c.beginPath();c.arc(cx2-5,fy-1,1.5,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx2+7,fy-1,1.5,0,Math.PI*2);c.fill();
  }else if(type==='zombie'){
    c.fillStyle='#ff0';c.shadowColor='#ff0';c.shadowBlur=5;
    c.beginPath();c.ellipse(cx2-6,fy,4,5,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx2+6,fy,4,5,0,0,Math.PI*2);c.fill();
    c.shadowBlur=0;
    c.fillStyle='#220';c.beginPath();c.arc(cx2-6,fy,2,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx2+6,fy,2,0,Math.PI*2);c.fill();
  }else{
    c.fillStyle='#fff';c.beginPath();c.ellipse(cx2-6,fy,5,5.5,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx2+6,fy,5,5.5,0,0,Math.PI*2);c.fill();
    c.fillStyle='#8a3060';c.beginPath();c.arc(cx2-5.5,fy+.5,3.2,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx2+5.5,fy+.5,3.2,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(cx2-4.5,fy-1,1.3,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx2+6.5,fy-1,1.3,0,Math.PI*2);c.fill();
  }
  if(type!=='zombie'&&type!=='boss'&&type!=='dark'&&type!=='night'){
    c.fillStyle='rgba(255,120,140,0.4)';
    c.beginPath();c.ellipse(cx2-10,fy+5,3.5,2.5,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx2+10,fy+5,3.5,2.5,0,0,Math.PI*2);c.fill();
  }
  if(type==='boss'||type==='dark'){
    c.strokeStyle='#c03050';c.lineWidth=1.5;c.beginPath();c.arc(cx2,fy+8,3,0.1,Math.PI-0.1);c.stroke();
  }else if(type==='zombie'){
    c.fillStyle='#400';c.beginPath();c.ellipse(cx2,fy+8,4,3,0,0,Math.PI*2);c.fill();
  }else{
    c.strokeStyle='#d06060';c.lineWidth=1.2;c.beginPath();c.arc(cx2,fy+7,2.5,0.1,Math.PI-0.1);c.stroke();
  }
  if(type==='boss'||type==='crown'){
    c.fillStyle='#fc0';c.beginPath();
    const crX=cx2,crY=fy-fr-4;
    c.moveTo(crX-10,crY+6);c.lineTo(crX-8,crY-2);c.lineTo(crX-4,crY+3);
    c.lineTo(crX,crY-4);c.lineTo(crX+4,crY+3);c.lineTo(crX+8,crY-2);c.lineTo(crX+10,crY+6);
    c.closePath();c.fill();
    c.fillStyle='#f44';c.beginPath();c.arc(crX,crY-1,2,0,Math.PI*2);c.fill();
  }
  if(type==='warrior'){
    c.fillStyle='#4af';c.beginPath();c.arc(cx2,cy2+8,8,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.font='bold 10px sans-serif';c.textAlign='center';c.fillText('⚔',cx2,cy2+12);
  }
  if(type==='skull'){
    c.fillStyle='#ddd';c.beginPath();c.arc(cx2,cy2+10,7,0,Math.PI*2);c.fill();
    c.fillStyle='#222';c.beginPath();c.arc(cx2-2,cy2+9,2,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(cx2+2,cy2+9,2,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(cx2-2,cy2+13);c.lineTo(cx2+2,cy2+13);c.lineWidth=1.5;c.strokeStyle='#222';c.stroke();
  }
  if(type==='broken'){c.fillStyle='#f44';c.font='14px serif';c.textAlign='center';c.fillText('💔',cx2,cy2+14);}
  if(type==='fire'){c.fillStyle='#f80';c.font='14px serif';c.textAlign='center';c.fillText('🔥',cx2,cy2+14);}
}

// ===== WORLD GEN =====
const tiles=[],obstacles=[],decor=[];
function genWorld(theme){
  tiles.length=0;obstacles.length=0;decor.length=0;bloodStains.length=0;groundCracks.length=0;
  const th=MAP_THEMES[theme];
  for(let i=0;i<300;i++)tiles.push({x:Math.random()*WW,y:Math.random()*WH,t:Math.floor(Math.random()*5),s:15+Math.random()*50});
  for(let i=0;i<80;i++){
    const t=Math.random();let o;
    if(t<.3) o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:40+Math.random()*80,h:30+Math.random()*60,type:'building',c:th.obstacleColors[Math.floor(Math.random()*4)],windows:Math.floor(Math.random()*4)+1};
    else if(t<.5) o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:50+Math.random()*30,h:25+Math.random()*15,type:'car',c:th.obstacleColors[Math.floor(Math.random()*4)]};
    else o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:20+Math.random()*50,h:20+Math.random()*50,type:'rubble',c:th.obstacleColors[0]};
    obstacles.push(o);
  }
  for(let i=0;i<200;i++)decor.push({x:Math.random()*WW,y:Math.random()*WH,t:Math.floor(Math.random()*4),rot:Math.random()*Math.PI*2});
  for(let i=0;i<50;i++)bloodStains.push({x:Math.random()*WW,y:Math.random()*WH,r:10+Math.random()*30,a:.1+Math.random()*.15});
  for(let i=0;i<30;i++){
    const ccx=Math.random()*WW,ccy=Math.random()*WH;const crack={x:ccx,y:ccy,segs:[]};
    let ax=ccx,ay=ccy,ang=Math.random()*Math.PI*2;
    for(let j=0;j<3+Math.floor(Math.random()*4);j++){ang+=(.5-Math.random())*.8;const nx=ax+Math.cos(ang)*(15+Math.random()*25),ny=ay+Math.sin(ang)*(15+Math.random()*25);crack.segs.push({x1:ax,y1:ay,x2:nx,y2:ny});ax=nx;ay=ny;}
    groundCracks.push(crack);
  }
  G.ambientLights.length=0;
  for(let i=0;i<8;i++)G.ambientLights.push({x:200+Math.random()*(WW-400),y:200+Math.random()*(WH-400),r:80+Math.random()*60,flicker:Math.random()*1000});
}
genWorld(0);

// ===== SPAWN =====
function spawnWave(w){
  const base=4+w*3;
  const regionBonus=Math.floor(w/10)*5;
  zThisWave=base+regionBonus;
  zSpawned=0;
}
function spawnZ(){
  if(zSpawned>=zThisWave)return;
  const e=Math.floor(Math.random()*4);let x,y;
  if(e===0){x=G.cam.x+Math.random()*W;y=G.cam.y-70;}
  else if(e===1){x=G.cam.x+W+70;y=G.cam.y+Math.random()*H;}
  else if(e===2){x=G.cam.x+Math.random()*W;y=G.cam.y+H+70;}
  else{x=G.cam.x-70;y=G.cam.y+Math.random()*H;}
  x=Math.max(30,Math.min(WW-30,x));y=Math.max(30,Math.min(WH-30,y));
  const w=G.wave;
  const elite=w>5&&Math.random()<.10+Math.floor(w/15)*.02;
  const fast=w>3&&Math.random()<.15+Math.floor(w/12)*.02;
  const tanky=w>10&&Math.random()<.06+Math.floor(w/20)*.02;
  let hpMult=1+Math.floor(w/10)*.5;
  const hp=(40+w*20)*hpMult*(elite?3:1)*(fast?.7:1)*(tanky?4:1);
  let r=elite?30:fast?16:tanky?28:20;
  let spd=(.7+Math.random()*.4+w*.05)*(fast?1.5:tanky?.5:1);
  let dmg=elite?15:fast?5:tanky?18:8;
  let type=elite?'elite':fast?'fast':tanky?'tanky':'normal';
  zombies.push({x,y,hp,mhp:hp,spd,r,type,dmg,burning:0,hitFlash:0,angle:Math.random()*Math.PI*2,wobble:Math.random()*1000,limbPhase:Math.random()*Math.PI*2});
  zSpawned++;
}

// ===== LOOT SYSTEM =====
function rollLoot(z){
  const table=LOOT_TABLE[z.type]||LOOT_TABLE.normal;
  if(Math.random()>table.chance)return;
  const coins=table.coins[0]+Math.floor(Math.random()*(table.coins[1]-table.coins[0]));
  G.coins+=coins;
  addFloatText(z.x,z.y-z.r-12,'+'+coins+'💰','#fc0');
  for(const item of table.items){
    if(Math.random()<item.chance){
      lootItems.push({x:z.x+(-15+Math.random()*30),y:z.y+(-15+Math.random()*30),name:item.name,icon:item.icon,type:item.type,life:15,bobPhase:Math.random()*Math.PI*2});
      showLootNotify(item.icon+' '+item.name);
      sndLoot();
    }
  }
}
function collectLoot(item){
  switch(item.type){
    case 'ammo': break;
    case 'healSmall': P.hp=Math.min(P.hp+25,P.mhp);addFloatText(P.x,P.y-30,'+25HP','#4f4');break;
    case 'healBig': P.hp=Math.min(P.hp+60,P.mhp);addFloatText(P.x,P.y-30,'+60HP','#4f4');break;

    case 'unlockW3': if(!WPNS[3].unlocked){WPNS[3].unlocked=true;addFloatText(P.x,P.y-30,'⚡ 激光炮解锁!','#ff0');switchWpn(3);}else{G.coins+=200;addFloatText(P.x,P.y-30,'+200🪙','#fc0');}break;

// ===== XP / LEVEL SYSTEM =====
function addXP(amount){

  while(G.xp>=G.xpNeeded){
    G.xp-=G.xpNeeded;
    G.level++;
    G.xpNeeded=Math.floor(G.xpNeeded*1.35);

// ===== PARTICLES =====
function spawnBlood(x,y,c=10,spread=4){
  for(let i=0;i<c;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*spread;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,dec:.02+Math.random()*.03,sz:1.5+Math.random()*4,col:`hsl(${Math.floor(Math.random()*25)},85%,${20+Math.floor(Math.random()*25)}%)`,gravity:.08,ground:false});}
  bloodStains.push({x:x+(-10+Math.random()*20),y:y+(-10+Math.random()*20),r:8+Math.random()*15,a:.15+Math.random()*.1});
  if(bloodStains.length>300)bloodStains.shift();
}
function spawnMuzzleFlash(x,y,angle){
  for(let i=0;i<6;i++){const a=angle+(.5-Math.random())*.6,s=3+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.1+Math.random()*.1,sz:2+Math.random()*3,col:`hsl(${40+Math.floor(Math.random()*20)},100%,${60+Math.floor(Math.random()*30)}%)`,gravity:0,ground:false});}
  P.muzzleFlash=3;
}
function spawnExplosion(x,y,r){
  explosions.push({x,y,r,life:1,dec:.03});
  for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*7;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,dec:.015+Math.random()*.02,sz:3+Math.random()*7,col:`hsl(${15+Math.floor(Math.random()*40)},100%,${40+Math.floor(Math.random()*40)}%)`,gravity:.06,ground:false});}
  for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=.5+Math.random()*2;
    particles.push({x:x+Math.cos(a)*r*.3,y:y+Math.sin(a)*r*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,dec:.008+Math.random()*.01,sz:10+Math.random()*20,col:'rgba(60,60,60,0.5)',gravity:-.02,ground:false});}
  zombies.forEach(z=>{const d=z.x-x,e=z.y-y;if(Math.sqrt(d*d+e*e)<r){z.hp-=WPNS[2].dmg*1.5*(1+.25*SHOP.find(i=>i.id==='wdmg').lv);z.hitFlash=6;spawnBlood(z.x,z.y,8);}});
  if(B.alive){const d=B.x-x,e=B.y-y;if(Math.sqrt(d*d+e*e)<r){B.hp-=WPNS[2].dmg*1.5;B.hitFlash=6;}}
  sndExplosion();addShake(12,200);
}

// ===== AUTO-AIM =====
function autoAim(){
  const AUTO_AIM_RANGE=500;
  let nearestZ=null;
  let nearestDist=AUTO_AIM_RANGE;
  
  // Find nearest zombie
  for(const z of zombies){
    const d=z.x-P.x,e=z.y-P.y;
    const dist=Math.sqrt(d*d+e*e);
    if(dist<nearestDist){
      nearestDist=dist;
      nearestZ=z;
    }
  }
  
  // Check boss
  if(B.alive){
    const d=B.x-P.x,e=B.y-P.y;
    const dist=Math.sqrt(d*d+e*e);
    if(dist<nearestDist){
      nearestDist=dist;
      nearestZ=B;
    }
  }
  
  if(nearestZ){
    P.angle=Math.atan2(nearestZ.y-P.y,nearestZ.x-P.x);
  } else {
    // Use last movement direction
    const len=Math.sqrt(P.lastMoveDir.x**2+P.lastMoveDir.y**2)||1;
    P.angle=Math.atan2(P.lastMoveDir.y/len,P.lastMoveDir.x/len);
  }
}

// ===== SHOOT =====
function shoot(now){
  if(G.state!=='playing'||now-lastShot<WPNS[P.wpn].rate)return;
  lastShot=now;const w=WPNS[P.wpn];
  
  // Auto-aim at nearest target
  autoAim();
  const ba=P.angle;
  
  spawnMuzzleFlash(P.x+Math.cos(ba)*P.r,P.y+Math.sin(ba)*P.r,ba);
  const totalBullets=w.bullets+P.bulletBonus;
  for(let i=0;i<totalBullets;i++){const a=ba+(Math.random()-.5)*w.spread;
    bullets.push({x:P.x+Math.cos(a)*P.r,y:P.y+Math.sin(a)*P.r,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,dmg:w.dmg,col:w.color,trail:w.trail,life:1,explosive:!!w.explosive,smallExplosive:!!w.smallExplosive,pierce:!!w.pierce,r:w.explosive?6:w.pierce?2:3,pierced:0,trailPts:[]});}
  w.snd();
}

function useSkill(i,now){
  const sk=SKS[i];if(now-sk.last<sk.cd)return;
  sk.last=now;sndSkill();
  if(i===0){const rng=200+sk.lv*50,dmg=70+sk.lv*25;zombies.forEach(z=>{const d=z.x-P.x,e=z.y-P.y;if(Math.sqrt(d*d+e*e)<rng){z.hp-=dmg;z.hitFlash=6;spawnBlood(z.x,z.y,12);addFloatText(z.x,z.y-20,'-'+dmg,'#f88');}});if(B.alive){const d=B.x-P.x,e=B.y-P.y;if(Math.sqrt(d*d+e*e)<rng){B.hp-=dmg*2;B.hitFlash=6;}}explosions.push({x:P.x,y:P.y,r:rng,life:1,dec:.02,col:'#88f'});addShake(10,200);sndExplosion();}
  if(i===1){const dur=3500+sk.lv*1200,dpt=6+sk.lv*4;for(let j=0;j<25;j++){const a=Math.random()*Math.PI*2,r=40+Math.random()*110;flames.push({x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,life:1,dec:1/(dur/16),dmg:dpt,r:25+Math.random()*15});}}
  if(i===2){P.shield=true;P.inv=3500+sk.lv*2200;setTimeout(()=>{P.shield=false;},3500+sk.lv*2200);}
  if(i===3){const dur=4500+sk.lv*2200;P.spdBoost=P.spd*1.9;setTimeout(()=>{P.spdBoost=0;},dur);}
}

function buyItem(id){
  const it=SHOP.find(i=>i.id===id);const cost=Math.floor(it.bc*Math.pow(1.5,it.lv));if(G.coins<cost)return;

// ===== MAIN LOOP =====
let lt=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lt,50);lt=ts;G.time=ts;
  if(G.state==='playing')update(ts,dt);
  render(ts);updSkills(ts);
}

function update(now,dt){
  const spd=(P.spdBoost||P.spd);
  let dx=0,dy=0;
  
  // Use joystick input
  if(G.joystick&&G.joystick.active){
    dx=G.joystick.dx;
    dy=G.joystick.dy;
    if(dx&&dy){dx*=.707;dy*=.707;}
    // Update last movement direction for auto-aim fallback
    if(Math.abs(dx)>0.1||Math.abs(dy)>0.1){
      P.lastMoveDir.x=dx;
      P.lastMoveDir.y=dy;
    }
  }
  
  // Keyboard fallback
  if(G.keys['w']||G.keys['arrowup'])dy=-1;
  if(G.keys['s']||G.keys['arrowdown'])dy=1;
  if(G.keys['a']||G.keys['arrowleft'])dx=-1;
  if(G.keys['d']||G.keys['arrowright'])dx=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  
  P.x+=dx*spd;P.y+=dy*spd;
  P.x=Math.max(P.r,Math.min(WW-P.r,P.x));
  P.y=Math.max(P.r,Math.min(WH-P.r,P.y));
  if(dx||dy)P.walkCycle+=dt*.008;

  G.cam.x=P.x-W/2;G.cam.y=P.y-H/2;
  G.cam.x=Math.max(0,Math.min(WW-W,G.cam.x));
  G.cam.y=Math.max(0,Math.min(WH-H,G.cam.y));
  if(G.shake.t>0){G.shake.t-=dt;const i=G.shake.intensity*(G.shake.t/300);G.shake.x=(Math.random()-.5)*i;G.shake.y=(Math.random()-.5)*i;}
  else{G.shake.x=0;G.shake.y=0;}

  if(G.mouse.down)shoot(now);
  if(zSpawned<zThisWave){wvTmr+=dt;if(wvTmr>800){wvTmr=0;spawnZ();}}

  // Auto-aim based on fire zone
  if(G.fireZone&&G.fireZone.touchActive){
    autoAim();
  }

  // Collect loot items
  for(let i=lootItems.length-1;i>=0;i--){
    const l=lootItems[i];l.life-=dt/1000;l.bobPhase+=dt*.004;
    const d=P.x-l.x,e=P.y-l.y;
    if(d*d+e*e<(P.r+20)**2){collectLoot(l);lootItems.splice(i,1);continue;}
    if(l.life<=0){lootItems.splice(i,1);}
  }

  bullets=bullets.filter(b=>{
    b.trailPts.push({x:b.x,y:b.y});if(b.trailPts.length>6)b.trailPts.shift();
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<0||b.x>WW||b.y<0||b.y>WH){if(b.explosive)spawnExplosion(b.x,b.y,b.smallExplosive?50:110);return false;}
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i],d=z.x-b.x,e=z.y-b.y;
      if(d*d+e*e<(z.r+b.r)**2){
        if(b.explosive){spawnExplosion(b.x,b.y,b.smallExplosive?60:130);return false;}
        z.hp-=b.dmg;z.hitFlash=4;spawnBlood(z.x,z.y,6);sndHit();addFloatText(z.x,z.y-z.r-8,'-'+b.dmg,'#ff8');
        if(b.pierce){b.pierced++;if(b.pierced>3)return false;return true;}
        return false;
      }
    }
    if(B.alive){const d=B.x-b.x,e=B.y-b.y;if(d*d+e*e<(B.r+b.r)**2){if(b.explosive){spawnExplosion(b.x,b.y,b.smallExplosive?60:130);return false;}B.hp-=b.dmg;B.hitFlash=4;spawnBlood(B.x,B.y,4);sndHit();if(b.pierce){b.pierced++;if(b.pierced>3)return false;return true;}return false;}}
    return true;
  });

  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.hp<=0){
      spawnBlood(z.x,z.y,18,5);
      const pts=z.type==='elite'?30:z.type==='fast'?15:z.type==='tanky'?35:10;
      G.score+=pts;G.killed++;
      addXP(z.type==='elite'?15:z.type==='tanky'?20:5);
      rollLoot(z);
      sndDeath();zombies.splice(i,1);continue;
    }
    const d=P.x-z.x,e=P.y-z.y,dist=Math.sqrt(d*d+e*e)||1;
    z.angle=Math.atan2(e,d);z.x+=d/dist*z.spd;z.y+=e/dist*z.spd;
    z.wobble+=dt*.005;z.limbPhase+=dt*.006*z.spd;
    if(z.burning>0){z.hp-=4*dt/16;z.burning-=dt;}
    if(z.hitFlash>0)z.hitFlash--;
    if(dist<P.r+z.r+4){
      if(P.inv>0){P.inv-=dt;}
      else{P.hp-=z.dmg*(dt/1000)*4;
        document.getElementById('dmg-flash').style.opacity='1';
        setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',80);
        addShake(4,80);
        if(P.hp<=0){P.hp=0;gameDead();return;}
      }
    }
    updHP();
  }

  flames=flames.filter(f=>{f.life-=f.dec;if(f.life<=0)return false;zombies.forEach(z=>{const d=z.x-f.x,e=z.y-f.y;if(d*d+e*e<f.r**2){z.hp-=f.dmg*(dt/1000)*3;z.burning=600;z.hitFlash=2;}});if(B.alive){const d=B.x-f.x,e=B.y-f.y;if(d*d+e*e<f.r**2)B.hp-=f.dmg*(dt/1000)*4;}return true;});

  // BOSS AI
  if(B.alive){
    if(B.hp<B.mhp*.5&&B.phase===1){B.phase=2;B.spd*=1.4;addShake(15,300);}
    const bd=P.x-B.x,be=P.y-B.y,bd2=Math.sqrt(bd*bd+be*be)||1;
    if(!B.charging){B.x+=bd/bd2*B.spd;B.y+=be/bd2*B.spd;}
    B.chgTmr+=dt;
    if(!B.charging&&B.chgTmr>2500){B.charging=true;B.chgTmr=0;B.cdx=bd/bd2*10;B.cdy=be/bd2*10;setTimeout(()=>{B.charging=false;},500);}
    if(B.charging){B.x+=B.cdx;B.y+=B.cdy;}
    B.x=Math.max(0,Math.min(WW,B.x));B.y=Math.max(0,Math.min(WH,B.y));
    const bp=P.x-B.x,bq=P.y-B.y,bpr=Math.sqrt(bp*bp+bq*bq)||1;
    if(bpr<P.r+B.r+5&&P.inv<=0&&!P.shield){P.hp-=35*(dt/1000)*4;addShake(8,120);document.getElementById('dmg-flash').style.opacity='1';setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',100);if(P.hp<=0){P.hp=0;gameDead();return;}updHP();}
    if(B.phase===2){B.atkTmr+=dt;
      if(B.atkTmr>1200){B.atkTmr=0;
        const bulletCount=B.type==='rose'?16:10;
        for(let a=0;a<bulletCount;a++){const ang=(a/bulletCount)*Math.PI*2;
          bullets.push({x:B.x,y:B.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,dmg:18,col:B.type==='rose'?'#f4a':'#f04',trail:B.type==='rose'?'#a4f':'#a02',life:1,r:5,isBoss:true,explosive:false,pierce:false,pierced:0,trailPts:[]});}sndShoot();}
      B.spawnTmr+=dt;if(B.spawnTmr>4000&&zombies.length<15){B.spawnTmr=0;
        const spawnCount=B.type==='rose'?3:2;
        for(let j=0;j<spawnCount;j++){const a=Math.random()*Math.PI*2;zombies.push({x:B.x+Math.cos(a)*80,y:B.y+Math.sin(a)*80,hp:30,mhp:30,spd:1+Math.random()*.5,r:18,type:'normal',dmg:8,burning:0,hitFlash:0,angle:0,wobble:Math.random()*1000,limbPhase:0});}}
    }
    if(B.type==='rose'&&B.phase===2){
      B.roarTmr+=dt;
      if(B.roarTmr>6000){B.roarTmr=0;
        for(let a=0;a<8;a++){
          const ang=Math.random()*Math.PI*2;
          particles.push({x:B.x,y:B.y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3-2,life:3,dec:.01,sz:8,col:'rgba(200,50,80,0.7)',gravity:-.01,ground:false,isPetal:true,dmg:12});
        }
        sndSkill();
      }
    }
    if(B.hitFlash>0)B.hitFlash--;
    if(B.hp<=0){
      B.alive=false;G.bossUp=false;G.bossDefeated=true;
      document.getElementById('bb').style.display='none';
      spawnExplosion(B.x,B.y,220);spawnBlood(B.x,B.y,50,8);
      const isFinal=G.wave>=50;
      if(isFinal){
        G.coins+=600;G.score+=1500;
      } else {
        G.coins+=200+G.wave*10;G.score+=800+G.wave*20;
      }
      addFloatText(B.x,B.y-60,'+'+ (200+G.wave*10) +'💰','#fc0');
      setTimeout(()=>showStory(G.wave>=50?50:G.wave),900);
    }
    document.getElementById('bb-f').style.width=(B.hp/B.mhp*100)+'%';
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.isPetal){
      const d=P.x-p.x,e=P.y-p.y;
      if(d*d+e*e<(P.r+10)**2&&P.inv<=0&&!P.shield){
        P.hp-=p.dmg;updHP();
        document.getElementById('dmg-flash').style.opacity='1';
        setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',80);
        particles.splice(i,1);
        if(P.hp<=0){P.hp=0;gameDead();return;}
      }
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];if(!b.isBoss)continue;
    const d=P.x-b.x,e=P.y-b.y;
    if(d*d+e*e<(P.r+b.r)**2){if(!P.shield&&P.inv<=0){P.hp-=b.dmg;updHP();document.getElementById('dmg-flash').style.opacity='1';setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',80);if(P.hp<=0){P.hp=0;gameDead();return;}}bullets.splice(i,1);}
  }

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(p.gravity){p.vy+=p.gravity;}p.vx*=.96;p.vy*=.96;p.life-=p.dec;return p.life>0;});
  explosions=explosions.filter(e=>{e.life-=e.dec;return e.life>0;});
  floatingTexts=floatingTexts.filter(f=>{f.y+=f.vy;f.life-=.02;return f.life>0;});

  if(zSpawned>=zThisWave&&zombies.length===0&&!B.alive){
    const isBossWave=G.wave%10===0;
    if(isBossWave&&!G.bossUp){
      const regionIdx=Math.min(Math.floor((G.wave-1)/10),4);
      genWorld(regionIdx);
      P.x=WW/2;P.y=WH/2;
      spawnBoss(G.wave);
      if(G.wave===10)showStory(10);
      else if(G.wave===20)showStory(20);
      else if(G.wave===30)showStory(30);
      else if(G.wave===40)showStory(40);
      else if(G.wave===50)showStory(49);
    }
    else if(!isBossWave||G.bossDefeated){
      G.bossDefeated=false;
      if(STORIES[G.wave]){
        showStory(G.wave);
      }
      G.wave++;updUI();
      G.coins+=50+G.wave*15;sndWave();announceWave(G.wave);
      if(G.wave%10===1){
        const regionIdx=Math.min(Math.floor((G.wave-1)/10),4);
        genWorld(regionIdx);
        P.x=WW/2;P.y=WH/2;
      }
      openShop();spawnWave(G.wave);
    }
  }
  updUI();
}

function announceWave(w){
  const el=document.getElementById('wave-ann');
  const region=MAP_THEMES[Math.min(Math.floor((w-1)/10),4)];
  el.textContent='⚔️ 第 '+w+' 波 · '+region.name+' ⚔️';
  el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);
}

      cx.beginPath();cx.arc(B.x+14,B.y-8,6,0,Math.PI*2);cx.fill();
      cx.shadowBlur=0;
      cx.font='34px serif';cx.textAlign='center';cx.shadowColor='#f4a';cx.shadowBlur=10;

      cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.arc(B.x-10,B.y-12,6,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(B.x+10,B.y-12,6,0,Math.PI*2);cx.fill();cx.fillRect(B.x-4,B.y-4,8,6);
      cx.font='34px serif';cx.textAlign='center';cx.shadowColor='#fa0';cx.shadowBlur=10;cx.fillText('👑',B.x,B.y-B.r-10);cx.shadowBlur=0;
      cx.fillStyle='#ff0';cx.shadowColor='#ff0';cx.shadowBlur=16;const eScale=B.phase===2?1.3:1;cx.beginPath();cx.arc(B.x-14,B.y-8,6*eScale,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(B.x+14,B.y-8,6*eScale,0,Math.PI*2);cx.fill();cx.shadowBlur=0;

  const lp2=P.walkCycle;

  cx.fillStyle=headG;cx.shadowColor='rgba(0,0,0,0.15)';cx.shadowBlur=4;
  cx.beginPath();cx.arc(px,py-P.r*.5,hr,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
  // 头发
  cx.fillStyle='#3a2a1a';
  cx.beginPath();cx.arc(px,py-P.r*.5-2,hr+1,Math.PI+0.3,Math.PI*2-0.3);cx.fill();
  // 刘海
  cx.beginPath();cx.moveTo(px-hr+2,py-P.r*.5-1);cx.quadraticCurveTo(px-hr*.3,py-P.r*.5+3,px-2,py-P.r*.5+4);cx.lineTo(px-hr*.5,py-P.r*.5-5);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(px+hr-2,py-P.r*.5-1);cx.quadraticCurveTo(px+hr*.3,py-P.r*.5+3,px+2,py-P.r*.5+4);cx.lineTo(px+hr*.5,py-P.r*.5-5);cx.closePath();cx.fill();
  // 眼睛（大Q版眼）
  cx.fillStyle='#fff';cx.beginPath();cx.ellipse(px-5,py-P.r*.52,4.5,5,0,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(px+5,py-P.r*.52,4.5,5,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#2255aa';cx.beginPath();cx.arc(px-4.5,py-P.r*.5,3,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(px+4.5,py-P.r*.5,3,0,Math.PI*2);cx.fill();

  // 红脸蛋
  cx.fillStyle='rgba(255,120,120,0.35)';
  cx.beginPath();cx.ellipse(px-8,py-P.r*.4,3,2,0,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(px+8,py-P.r*.4,3,2,0,0,Math.PI*2);cx.fill();
  // 武器
  const ga=P.angle;
  const gunColors=['#556','#665','#655','#5af','#a5a'];
  const gunLen=[22,18,28,30,22];

  const wi=P.wpn;
  cx.save();cx.translate(px,py);cx.rotate(ga);
  cx.fillStyle=gunColors[wi];cx.fillRect(P.r-4,-gunW[wi]/2,gunLen[wi],gunW[wi]);
  cx.fillStyle='#334';cx.fillRect(P.r+gunLen[wi]-4,-gunW[wi]/2-1,5,gunW[wi]+2);
  if(P.muzzleFlash>0){P.muzzleFlash--;const fg=cx.createRadialGradient(P.r+gunLen[wi],0,0,P.r+gunLen[wi],0,20);fg.addColorStop(0,'rgba(255,255,200,0.9)');fg.addColorStop(0.3,'rgba(255,200,50,0.5)');fg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=fg;cx.beginPath();cx.arc(P.r+gunLen[wi],0,20,0,Math.PI*2);cx.fill();}
  cx.restore();

  floatingTexts.forEach(f=>{cx.globalAlpha=f.life;cx.fillStyle=f.color;cx.font='bold 14px Microsoft YaHei';cx.textAlign='center';cx.fillText(f.text,f.x,f.y);cx.globalAlpha=1;});

  const vg=cx.createRadialGradient(px,py,Math.min(W,H)*.35,px,py,Math.max(W,H)*.8);

  cx.strokeStyle='rgba(100,150,255,0.3)';cx.strokeRect(mmx+G.cam.x*scx2,mmy+G.cam.y*scy2,W*scx2,H*scy2);

  cx.fillStyle='#f44';zombies.forEach(z=>cx.fillRect(mmx+z.x*scx2,mmy+z.y*scy2,2,2));
  if(B.alive){cx.fillStyle=B.type==='rose'?'#f4a':'#f0f';cx.fillRect(mmx+B.x*scx2-3,mmy+B.y*scy2-3,6,6);}

// ===== TOUCH INPUT =====
G.joystick={active:false,dx:0,dy:0,id:null,startX:0,startY:0};
G.fireZone={active:false,touchActive:false,id:null};

const joystickBase=document.getElementById('joystick-base');
const joystickThumb=document.getElementById('joystick-thumb');
const fireBtn=document.getElementById('fire-btn');
const fireZone=document.getElementById('fire-zone');
const joystickZone=document.getElementById('joystick-zone');

const MAX_JOYSTICK_DIST=50;

function getBaseCenter(){
  const rect=joystickBase.getBoundingClientRect();
  return{
    x:rect.left+rect.width/2,
    y:rect.top+rect.height/2
  };
}

function updateJoystick(clientX,clientY){
  const center=getBaseCenter();
  let dx=clientX-center.x;
  let dy=clientY-center.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  
  if(dist>MAX_JOYSTICK_DIST){
    dx=dx/dist*MAX_JOYSTICK_DIST;
    dy=dy/dist*MAX_JOYSTICK_DIST;
  }
  
  // Update thumb position
  joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;
  
  // Normalize to -1 to 1
  G.joystick.dx=dx/MAX_JOYSTICK_DIST;
  G.joystick.dy=dy/MAX_JOYSTICK_DIST;
}

function resetJoystick(){
  G.joystick.active=false;
  G.joystick.dx=0;
  G.joystick.dy=0;
  G.joystick.id=null;
  joystickThumb.style.transform='translate(0,0)';
  joystickThumb.classList.remove('active');
}

// Joystick zone touch handlers
joystickZone.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(G.state!=='playing')return;
  
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    // Start joystick
    if(G.joystick.id===null){
      G.joystick.id=touch.identifier;
      G.joystick.active=true;
      G.joystick.startX=touch.clientX;
      G.joystick.startY=touch.clientY;
      joystickThumb.classList.add('active');
      updateJoystick(touch.clientX,touch.clientY);
      if(AC.state==='suspended')AC.resume();
    }
  }
},false);

joystickZone.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    if(touch.identifier===G.joystick.id){
      updateJoystick(touch.clientX,touch.clientY);
    }
  }
},false);

joystickZone.addEventListener('touchend',function(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    if(touch.identifier===G.joystick.id){
      resetJoystick();
    }
  }
},false);

joystickZone.addEventListener('touchcancel',function(e){
  e.preventDefault();
  resetJoystick();
},false);

// Fire zone touch handlers
fireZone.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(G.state!=='playing')return;
  
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    // Check if touch is on fire button
    const fireRect=fireBtn.getBoundingClientRect();
    if(touch.clientX>=fireRect.left&&touch.clientX<=fireRect.right&&
       touch.clientY>=fireRect.top&&touch.clientY<=fireRect.bottom){
      // Fire button pressed
      if(G.fireZone.id===null){
        G.fireZone.id=touch.identifier;
        G.mouse.down=true;
        fireBtn.classList.add('active');
        if(AC.state==='suspended')AC.resume();
      }
    } else {
      // Aim in fire zone (not on button)
      G.fireZone.touchActive=true;
    }
  }
},false);

fireZone.addEventListener('touchmove',function(e){
  e.preventDefault();
  // Track aim direction from fire zone touches
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    if(touch.identifier===G.fireZone.id){
      // Fire button held - shooting is handled by G.mouse.down in update loop
    }
  }
},false);

fireZone.addEventListener('touchend',function(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const touch=e.changedTouches[i];
    if(touch.identifier===G.fireZone.id){
      G.fireZone.id=null;
      G.mouse.down=false;
      fireBtn.classList.remove('active');
    }
  }
  // Check if any other touches remain in fire zone (for aim)
  let hasAimTouch=false;
  for(let i=0;i<e.touches.length;i++){
    const touch=e.touches[i];
    const fireRect=fireBtn.getBoundingClientRect();
    if(!(touch.clientX>=fireRect.left&&touch.clientX<=fireRect.right&&
         touch.clientY>=fireRect.top&&touch.clientY<=fireRect.bottom)){
      hasAimTouch=true;
    }
  }
  G.fireZone.touchActive=hasAimTouch;
},false);

fireZone.addEventListener('touchcancel',function(e){
  e.preventDefault();
  G.fireZone.id=null;
  G.fireZone.touchActive=false;
  G.mouse.down=false;
  fireBtn.classList.remove('active');
},false);

// Prevent default touch behaviors only on game zones (not UI buttons)
document.addEventListener('touchmove',function(e){
  const t=e.target;
  if(t.closest('#joystick-zone')||t.closest('#fire-zone')||t.closest('canvas')){
    e.preventDefault();
  }
},{passive:false});

// ===== KEYBOARD FALLBACK =====
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();G.keys[k]=true;
  if(G.state==='playing'){
    if(k==='q')useSkill(0,performance.now());
    if(k==='e')useSkill(1,performance.now());
    if(k==='r')useSkill(2,performance.now());
    if(k==='f')useSkill(3,performance.now());
    if(k==='1')switchWpn(0);if(k==='2')switchWpn(1);if(k==='3')switchWpn(2);if(k==='4')switchWpn(3);if(k==='5')switchWpn(4);
    if(k==='tab'){e.preventDefault();openShop();}
  }
  if(G.state==='shop'&&k==='tab'){e.preventDefault();closeShop();}
});
window.addEventListener('keyup',e=>G.keys[e.key.toLowerCase()]=false);

// ===== STORY =====
function showStory(k){
  const s=STORIES[k];if(!s)return;G.state='story';
  document.getElementById('s-pt').textContent=s.p;
  document.getElementById('s-tl').textContent=s.t;
  document.getElementById('s-tx').innerHTML=s.x;

  // Set princess avatar based on story type
  const avatar=document.getElementById('princess-avatar');
  avatar.className='princess-avatar';
  let avatarType='rose';
  if(k===0){avatarType='warrior';}
  else if(k===50){avatarType='win';avatar.classList.add('avatar-win');}
  else if(k===49){avatarType='boss';avatar.classList.add('avatar-boss');}
  else if(k===10||k===20||k===30||k===40){avatarType='skull';}
  else if(s.p==='🌹'){avatarType='rose';}
  else if(s.p==='🖤'){avatarType='dark';avatar.classList.add('avatar-dark');}
  else if(s.p==='🧟'){avatarType='zombie';}
  else if(s.p==='👑'){avatarType='crown';avatar.classList.add('avatar-dark');}
  else if(s.p==='💔'){avatarType='broken';}
  else if(s.p==='⚡'){avatarType='dark';avatar.classList.add('avatar-dark');}
  else if(s.p==='🔥'){avatarType='fire';}
  else if(s.p==='🌑'){avatarType='night';avatar.classList.add('avatar-dark');}
  else{avatarType='rose';}
  drawPrincessAvatar(avatar,avatarType);

  document.getElementById('sp').style.display='flex';
  const isWin=k===50;
  document.getElementById('s-bn').textContent=isWin?'重新游戏':'继续战斗';
  document.getElementById('s-bn').onclick=isWin?()=>location.reload():closeStory;
  if(isWin){
    setTimeout(()=>{
      const fs=document.getElementById('final-score');
      const fk=document.getElementById('final-kills');
      if(fs)fs.textContent=G.score;
      if(fk)fk.textContent=G.killed;
    },50);
  }
}
