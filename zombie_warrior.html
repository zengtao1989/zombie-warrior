<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>战士大战僵尸 - 解救玫瑰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Microsoft YaHei',sans-serif;overflow:hidden;cursor:crosshair}
canvas{display:block}
#ui{position:fixed;top:0;left:0;right:0;padding:8px 14px;background:linear-gradient(180deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.3) 70%,transparent);display:flex;align-items:center;gap:14px;z-index:10;pointer-events:none}
#hp-wrap{display:flex;align-items:center;gap:5px}
#hp-icon{font-size:16px;filter:drop-shadow(0 0 4px #f00)}
#hp-outer{width:160px;height:14px;background:linear-gradient(180deg,#1a0000,#0d0000);border-radius:7px;overflow:hidden;border:1px solid #600;box-shadow:inset 0 1px 4px rgba(0,0,0,.8)}
#hp-fill{height:100%;border-radius:7px;transition:width .12s;background:linear-gradient(180deg,#f44,#c00);box-shadow:0 0 8px #f004}
#hp-text{color:#f88;font-size:11px;font-weight:bold;min-width:32px}
#ammo{color:#ffe066;font-size:13px;font-weight:bold;text-shadow:0 0 6px #ff04}
#coins-d{color:#fc0;font-size:13px;font-weight:bold;text-shadow:0 0 6px #fc04}
#score-wrap{margin-left:auto;text-align:right}
#score{color:#fff;font-size:15px;font-weight:bold;text-shadow:0 0 8px #fff2}
#wave-lbl{color:#f80;font-size:12px;text-shadow:0 0 6px #f804}
#skill-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;pointer-events:none}
.sk-s{width:54px;height:54px;border-radius:8px;border:2px solid #333;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;font-size:9px;gap:1px;backdrop-filter:blur(4px)}
.sk-s.ready{border-color:#f80;box-shadow:0 0 12px #f806,0 0 4px #f804}
.sk-s .si{font-size:22px}
.sk-s .sk{font-size:10px;color:#999;position:absolute;bottom:2px;right:4px}
.sk-s .cd{position:absolute;inset:0;border-radius:6px;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;color:#ff0;font-size:13px;font-weight:bold}
#wpn-bar{position:fixed;bottom:12px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:10;pointer-events:none}
.w-s{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.75);border-radius:6px;padding:4px 10px;border:1px solid #333;color:#aaa;font-size:11px;backdrop-filter:blur(4px);transition:all .15s}
.w-s.act{border-color:#ff0;color:#ff0;box-shadow:0 0 8px #ff04}
.w-s .wi{font-size:18px}
#overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,0,0,.95),rgba(0,0,0,.98))}
#overlay h1{color:#f00;font-size:52px;text-shadow:0 0 40px #f00,0 0 80px #f004;margin-bottom:4px;letter-spacing:4px}
#overlay .sub{color:#ffb;font-size:17px;margin-bottom:28px;text-align:center;line-height:2}
#overlay button{background:linear-gradient(135deg,#c00,#600);color:#fff;border:2px solid #f44;padding:14px 52px;font-size:20px;border-radius:8px;cursor:pointer;font-family:inherit;box-shadow:0 4px 30px #f006,0 0 60px #f003;transition:all .2s;letter-spacing:2px}
#overlay button:hover{background:linear-gradient(135deg,#f00,#c00);transform:scale(1.06);box-shadow:0 4px 40px #f008,0 0 80px #f005}
#sp{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#sp .sb{max-width:580px;background:linear-gradient(135deg,#1a0808,#0a0404);border:2px solid #600;border-radius:14px;padding:28px;color:#eee;line-height:2;font-size:15px;box-shadow:0 0 50px #f002,0 0 100px #f001}
#sp h2{color:#f44;text-align:center;margin-bottom:14px;font-size:22px;text-shadow:0 0 10px #f004}
#sp .pt{text-align:center;font-size:64px;margin-bottom:8px;filter:drop-shadow(0 0 12px #f004)}
#sp button{background:linear-gradient(135deg,#900,#500);color:#fff;border:1px solid #a00;padding:11px 40px;font-size:16px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
#sp button:hover{background:linear-gradient(135deg,#c00,#800)}
#shp{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto;backdrop-filter:blur(6px)}
#shp h2{color:#fc0;font-size:26px;margin-bottom:4px;text-shadow:0 0 12px #fc04}
#shp .cn{color:#f80;font-size:16px;margin-bottom:18px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:100%;max-width:860px}
.si{background:linear-gradient(135deg,#1a1200,#0a0800);border:2px solid #443200;border-radius:10px;padding:14px;color:#ddd;cursor:pointer;transition:all .2s}
.si:hover:not(.dis){border-color:#f80;background:linear-gradient(135deg,#221800,#120c00);transform:translateY(-2px);box-shadow:0 4px 16px #f803}
.si.dis{opacity:.4;cursor:not-allowed}
.si h3{color:#fc0;font-size:14px;margin-bottom:5px}
.si p{font-size:11px;color:#999;margin-bottom:8px;line-height:1.6}
.si .pr{color:#f80;font-weight:bold;font-size:13px}
.si .lv{color:#88f;font-size:11px;float:right}
#sc{background:linear-gradient(135deg,#600,#300);color:#fff;border:1px solid #a00;padding:10px 36px;font-size:15px;border-radius:8px;cursor:pointer;font-family:inherit;margin-top:18px;transition:all .15s}
#sc:hover{background:linear-gradient(135deg,#800,#500)}
#rb{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:2px solid #f9a;border-radius:8px;padding:5px 18px;color:#f9a;font-size:12px;z-index:10;pointer-events:none;text-align:center;backdrop-filter:blur(4px)}
#rb span{font-weight:bold;color:#fc0}
#hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);color:#555;font-size:11px;z-index:10;pointer-events:none;text-align:center}
#bb{position:fixed;top:46px;left:50%;transform:translateX(-50%);width:320px;z-index:10;pointer-events:none;display:none}
#bb-l{color:#f44;font-size:12px;text-align:center;margin-bottom:2px;text-shadow:0 0 6px #f004}
#bb-bg{height:12px;background:linear-gradient(180deg,#200,#100);border-radius:6px;overflow:hidden;border:1px solid #600}
#bb-f{height:100%;background:linear-gradient(180deg,#f44,#c00);border-radius:6px;transition:width .1s;box-shadow:0 0 8px #f004}
#dmg-flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,.3));opacity:0;transition:opacity .1s}
#wave-ann{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);color:#f80;font-size:36px;font-weight:bold;text-shadow:0 0 20px #f80,0 0 40px #f004;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s}
/* Rose notification */
#rose-notify{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(60,20,40,.9);border:2px solid #f9a;border-radius:10px;padding:8px 20px;color:#f9a;font-size:13px;z-index:10;pointer-events:none;display:none;text-align:center;backdrop-filter:blur(4px);box-shadow:0 0 20px #f9a3}
#rose-notify em{color:#fc0;font-style:normal}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dmg-flash"></div>
<div id="wave-ann"></div>
<div id="ui">
 <div id="hp-wrap"><span id="hp-icon">❤️</span><div id="hp-outer"><div id="hp-fill"></div></div><span id="hp-text">100</span></div>
 <span id="ammo">🔫 ∞</span>
 <span id="coins-d">🪙 0</span>
 <div id="score-wrap"><div id="score">得分: 0</div><div id="wave-lbl">第1波</div></div>
</div>
<div id="bb"><div id="bb-l">👑 僵尸王</div><div id="bb-bg"><div id="bb-f"></div></div></div>
<div id="rb" style="display:none">解救玫瑰: <span id="rp">0</span>% — 消灭守卫！</div>
<div id="rose-notify"></div>
<div id="skill-bar">
 <div class="sk-s" id="sk0"><span class="si">💥</span><span>冲击波</span><span class="sk">Q</span></div>
 <div class="sk-s" id="sk1"><span class="si">🔥</span><span>烈焰术</span><span class="sk">E</span></div>
 <div class="sk-s" id="sk2"><span class="si">🛡️</span><span>护盾</span><span class="sk">R</span></div>
 <div class="sk-s" id="sk3"><span class="si">⚡</span><span>极速</span><span class="sk">F</span></div>
</div>
<div id="wpn-bar">
 <div class="w-s act" id="w0"><span class="wi">🔫</span><span id="w0n">手枪 Lv1</span></div>
 <div class="w-s" id="w1"><span class="wi">🔫</span><span id="w1n">霰弹枪</span></div>
 <div class="w-s" id="w2"><span class="wi">🚀</span><span id="w2n">火箭筒</span></div>
</div>
<div id="hint">WASD移动 · 鼠标射击 · Q冲击波 E烈焰 R护盾 F极速 · TAB商店 · 滚轮切武器</div>
<div id="overlay">
 <h1>⚔️ 战士大战僵尸</h1>
 <div class="sub">🌹 僵尸王囚禁了玫瑰<br>你是唯一能救她的战士<br>穿越废土，消灭一切！</div>
 <button onclick="startGame()">开始战斗</button>
</div>
<div id="sp" style="display:none">
 <div class="sb"><div class="pt" id="s-pt">⚔️</div><h2 id="s-tl">??</h2><div id="s-tx">...</div></div>
 <button id="s-bn" onclick="closeStory()">继续战斗</button>
</div>
<div id="shp" style="display:none">
 <h2>⚔️ 升级商店</h2>
 <div class="cn" id="shp-c">🪙 0</div>
 <div class="sg" id="shp-g"></div>
 <button id="sc" onclick="closeShop()">关闭 [TAB]</button>
</div>

<script>
const W=window.innerWidth,H=window.innerHeight;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=W;cv.height=H;

// ===== AUDIO ENGINE =====
const AC=new(window.AudioContext||window.webkitAudioContext)();
function sfx(freq,dur,type='square',vol=.08){
  try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
function sndShoot(){sfx(800,.06,'square',.04);sfx(200,.04,'sawtooth',.03)}
function sndShotgun(){sfx(150,.1,'sawtooth',.06);sfx(80,.15,'square',.04)}
function sndRocket(){sfx(100,.3,'sawtooth',.06);sfx(60,.4,'square',.04)}
function sndHit(){sfx(300,.05,'square',.03);sfx(150,.08,'sawtooth',.02)}
function sndExplosion(){sfx(60,.4,'sawtooth',.1);sfx(40,.6,'square',.06);sfx(80,.2,'triangle',.05)}
function sndSkill(){sfx(500,.15,'sine',.05);sfx(800,.1,'sine',.04)}
function sndDeath(){sfx(200,.5,'sawtooth',.08);sfx(100,.8,'square',.05)}
function sndCoin(){sfx(1200,.08,'sine',.03);sfx(1600,.06,'sine',.02)}
function sndWave(){sfx(400,.2,'triangle',.06);sfx(600,.15,'sine',.04);sfx(800,.1,'sine',.03)}

// ===== GAME STATE =====
const G={state:'menu',wave:1,maxWave:8,score:0,coins:0,killed:0,
  rescueKills:0,rescueTarget:0,rescueWave:5,
  bossUp:false,bossDown:false,
  keys:{},mouse:{x:W/2,y:H/2,down:false},
  cam:{x:0,y:0},shake:{x:0,y:0,t:0,intensity:0},
  time:0,ambientLights:[],roseNotifyTmr:0};

const WW=3200,WH=3200;

// ===== PLAYER =====
const P={x:WW/2,y:WH/2,hp:100,mhp:100,spd:3.2,r:18,wpn:0,
  inv:0,shield:false,spdBoost:0,angle:0,muzzleFlash:0,walkCycle:0};

// ===== WEAPONS =====
const WPNS=[
  {name:'手枪',lv:1,unlocked:true,dmg:18,rate:180,bullets:1,spread:0,spd:14,color:'#ff0',trail:'#fa0',snd:sndShoot},
  {name:'霰弹枪',lv:1,unlocked:false,dmg:14,rate:550,bullets:7,spread:.28,spd:11,color:'#fa0',trail:'#f80',snd:sndShotgun},
  {name:'火箭筒',lv:1,unlocked:false,dmg:90,rate:1400,bullets:1,spread:0,spd:9,color:'#f44',trail:'#f80',explosive:true,snd:sndRocket},
];

// ===== SKILLS =====
const SKS=[
  {name:'冲击波',cd:7000,last:0,lv:1},
  {name:'烈焰术',cd:11000,last:0,lv:1},
  {name:'护盾',cd:14000,last:0,lv:1},
  {name:'极速',cd:9000,last:0,lv:1},
];

// ===== SHOP =====
const SHOP=[
  {id:'hp',name:'强化体魄',icon:'❤️',desc:'最大HP+30,恢复30',bc:80,mx:5,lv:0},
  {id:'spd',name:'疾风之脚',icon:'👟',desc:'移速+0.5',bc:60,mx:4,lv:0},
  {id:'w1',name:'解锁霰弹枪',icon:'🔫',desc:'7发扇形弹幕',bc:150,mx:1,lv:0},
  {id:'w2',name:'解锁火箭筒',icon:'🚀',desc:'爆炸溅射伤害',bc:300,mx:1,lv:0},
  {id:'wdmg',name:'武器强化',icon:'⚔️',desc:'全武器伤害+25%',bc:100,mx:5,lv:0},
  {id:'s0',name:'冲击波+',icon:'💥',desc:'范围+伤害+',bc:120,mx:3,lv:0},
  {id:'s1',name:'烈焰术+',icon:'🔥',desc:'持续+伤害+',bc:120,mx:3,lv:0},
  {id:'s2',name:'护盾+',icon:'🛡️',desc:'持续更长',bc:100,mx:3,lv:0},
  {id:'s3',name:'极速+',icon:'⚡',desc:'持续更长',bc:80,mx:3,lv:0},
  {id:'heal',name:'急救包',icon:'🩹',desc:'恢复50HP',bc:50,mx:99,lv:0},
];

// ===== ENTITIES =====
let bullets=[],zombies=[],particles=[],flames=[],explosions=[];
let bloodStains=[],groundCracks=[],lastShot=0,wvTmr=0;
let zThisWave=0,zSpawned=0;
let floatingTexts=[];

// ===== WORLD GEN =====
const tiles=[],obstacles=[],decor=[];
function genWorld(){
  for(let i=0;i<300;i++)tiles.push({x:Math.random()*WW,y:Math.random()*WH,t:Math.floor(Math.random()*5),s:15+Math.random()*50});
  for(let i=0;i<80;i++){
    const t=Math.random();let o;
    if(t<.3) o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:40+Math.random()*80,h:30+Math.random()*60,type:'building',c:['#2a1a0a','#1a1a1a','#222018','#1c1810'][Math.floor(Math.random()*4)],windows:Math.floor(Math.random()*4)+1};
    else if(t<.5) o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:50+Math.random()*30,h:25+Math.random()*15,type:'car',c:['#3a2020','#203020','#202030','#303020'][Math.floor(Math.random()*4)]};
    else o={x:100+Math.random()*(WW-200),y:100+Math.random()*(WH-200),w:20+Math.random()*50,h:20+Math.random()*50,type:'rubble',c:'#1a1510'};
    obstacles.push(o);
  }
  // Larger, more prominent cage for Rose
  obstacles.push({x:WW*0.82-65,y:WH*0.82-65,w:130,h:130,type:'cage',c:'#443300'});
  for(let i=0;i<200;i++)decor.push({x:Math.random()*WW,y:Math.random()*WH,t:Math.floor(Math.random()*4),rot:Math.random()*Math.PI*2});
  for(let i=0;i<50;i++)bloodStains.push({x:Math.random()*WW,y:Math.random()*WH,r:10+Math.random()*30,a:.1+Math.random()*.15});
  for(let i=0;i<30;i++){
    const ccx=Math.random()*WW,ccy=Math.random()*WH;const crack={x:ccx,y:ccy,segs:[]};
    let ax=ccx,ay=ccy,ang=Math.random()*Math.PI*2;
    for(let j=0;j<3+Math.floor(Math.random()*4);j++){ang+=(.5-Math.random())*.8;const nx=ax+Math.cos(ang)*(15+Math.random()*25),ny=ay+Math.sin(ang)*(15+Math.random()*25);crack.segs.push({x1:ax,y1:ay,x2:nx,y2:ny});ax=nx;ay=ny;}
    groundCracks.push(crack);
  }
  for(let i=0;i<8;i++)G.ambientLights.push({x:200+Math.random()*(WW-400),y:200+Math.random()*(WH-400),r:80+Math.random()*60,flicker:Math.random()*1000});
  // Blood trail leading to cage - hints of Rose's capture
  for(let i=0;i<25;i++){
    const t=i/25;
    bloodStains.push({x:WW*0.5+t*(WW*0.82-WW*0.5)+(-25+Math.random()*50),y:WH*0.5+t*(WH*0.82-WH*0.5)+(-25+Math.random()*50),r:15+Math.random()*25,a:.2+Math.random()*.15});
  }
  // Broken rose petals along the trail
  for(let i=0;i<12;i++){
    const t=.1+Math.random()*.8;
    decor.push({x:WW*0.5+t*(WW*0.82-WW*0.5)+(-40+Math.random()*80),y:WH*0.5+t*(WH*0.82-WH*0.5)+(-40+Math.random()*80),t:5,rot:Math.random()*Math.PI*2});
  }
}
genWorld();

// ===== SPAWN =====
function spawnWave(w){zThisWave=6+w*5+(w>5?(w-5)*4:0);zSpawned=0;if(w>=G.rescueWave){G.rescueTarget=zThisWave;G.rescueKills=0;}}
function spawnZ(){
  if(zSpawned>=zThisWave)return;
  const e=Math.floor(Math.random()*4);let x,y;
  if(e===0){x=G.cam.x+Math.random()*W;y=G.cam.y-70;}
  else if(e===1){x=G.cam.x+W+70;y=G.cam.y+Math.random()*H;}
  else if(e===2){x=G.cam.x+Math.random()*W;y=G.cam.y+H+70;}
  else{x=G.cam.x-70;y=G.cam.y+Math.random()*H;}
  x=Math.max(30,Math.min(WW-30,x));y=Math.max(30,Math.min(WH-30,y));
  const elite=G.wave>3&&Math.random()<.15;
  const fast=G.wave>2&&Math.random()<.2;
  const hp=(25+G.wave*14)*(elite?3:1)*(fast?.7:1);
  zombies.push({x,y,hp,mhp:hp,spd:(.9+Math.random()*.5+G.wave*.1)*(fast?1.6:1),r:elite?30:fast?16:20,type:elite?'elite':fast?'fast':'normal',dmg:elite?18:fast?6:10,burning:0,hitFlash:0,angle:Math.random()*Math.PI*2,wobble:Math.random()*1000,limbPhase:Math.random()*Math.PI*2});
  zSpawned++;
}

// ===== BOSS =====
const B={alive:false,x:WW*.82,y:WH*.82,hp:0,mhp:2500,r:50,spd:1.1,phase:1,atkTmr:0,chgTmr:0,charging:false,cdx:0,cdy:0,hitFlash:0,roarTmr:0,spawnTmr:0};
function spawnBoss(){B.alive=true;B.hp=B.mhp;B.x=WW*.82;B.y=WH*.82;G.bossUp=true;document.getElementById('bb').style.display='block';showStory('boss');sndDeath();addShake(20,300);}

// ===== SCREEN SHAKE =====
function addShake(intensity,dur){G.shake.t=dur;G.shake.intensity=intensity;}

// ===== FLOATING TEXT =====
function addFloatText(x,y,text,color='#fc0'){floatingTexts.push({x,y,text,color,life:1,vy:-1.5});}

// ===== ROSE NOTIFICATION =====
function showRoseNotify(text){
  const el=document.getElementById('rose-notify');
  el.innerHTML=text;el.style.display='block';
  clearTimeout(G.roseNotifyTmr);
  G.roseNotifyTmr=setTimeout(()=>el.style.display='none',3500);
}

// ===== PARTICLES =====
function spawnBlood(x,y,c=10,spread=4){
  for(let i=0;i<c;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*spread;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,dec:.02+Math.random()*.03,sz:1.5+Math.random()*4,col:`hsl(${Math.floor(Math.random()*25)},85%,${20+Math.floor(Math.random()*25)}%)`,gravity:.08,ground:false});}
  bloodStains.push({x:x+(-10+Math.random()*20),y:y+(-10+Math.random()*20),r:8+Math.random()*15,a:.15+Math.random()*.1});
  if(bloodStains.length>300)bloodStains.shift();
}
function spawnMuzzleFlash(x,y,angle){
  for(let i=0;i<6;i++){const a=angle+(.5-Math.random())*.6,s=3+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.1+Math.random()*.1,sz:2+Math.random()*3,col:`hsl(${40+Math.floor(Math.random()*20)},100%,${60+Math.floor(Math.random()*30)}%)`,gravity:0,ground:false});}
  P.muzzleFlash=3;
}
function spawnExplosion(x,y,r){
  explosions.push({x,y,r,life:1,dec:.03});
  for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*7;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,dec:.015+Math.random()*.02,sz:3+Math.random()*7,col:`hsl(${15+Math.floor(Math.random()*40)},100%,${40+Math.floor(Math.random()*40)}%)`,gravity:.06,ground:false});}
  for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=.5+Math.random()*2;
    particles.push({x:x+Math.cos(a)*r*.3,y:y+Math.sin(a)*r*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,dec:.008+Math.random()*.01,sz:10+Math.random()*20,col:'rgba(60,60,60,0.5)',gravity:-.02,ground:false});}
  zombies.forEach(z=>{const d=z.x-x,e=z.y-y;if(Math.sqrt(d*d+e*e)<r){z.hp-=WPNS[2].dmg*1.5*(1+.25*SHOP.find(i=>i.id==='wdmg').lv);z.hitFlash=6;spawnBlood(z.x,z.y,8);}});
  if(B.alive){const d=B.x-x,e=B.y-y;if(Math.sqrt(d*d+e*e)<r){B.hp-=WPNS[2].dmg*1.5;B.hitFlash=6;}}
  sndExplosion();addShake(12,200);
}

// ===== SHOOT =====
function shoot(now){
  if(G.state!=='playing'||now-lastShot<WPNS[P.wpn].rate)return;
  lastShot=now;const w=WPNS[P.wpn];
  const mx=G.mouse.x+G.cam.x+G.shake.x,my=G.mouse.y+G.cam.y+G.shake.y;
  const ba=Math.atan2(my-P.y,mx-P.x);P.angle=ba;
  spawnMuzzleFlash(P.x+Math.cos(ba)*P.r,P.y+Math.sin(ba)*P.r,ba);
  for(let i=0;i<w.bullets;i++){const a=ba+(Math.random()-.5)*w.spread;
    bullets.push({x:P.x+Math.cos(a)*P.r,y:P.y+Math.sin(a)*P.r,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,dmg:w.dmg,col:w.color,trail:w.trail,life:1,explosive:!!w.explosive,r:w.explosive?6:3,trailPts:[]});}
  w.snd();
}

// ===== SKILL =====
function useSkill(i,now){
  const sk=SKS[i];if(now-sk.last<sk.cd)return;
  sk.last=now;sndSkill();
  if(i===0){const rng=200+sk.lv*50,dmg=70+sk.lv*25;zombies.forEach(z=>{const d=z.x-P.x,e=z.y-P.y;if(Math.sqrt(d*d+e*e)<rng){z.hp-=dmg;z.hitFlash=6;spawnBlood(z.x,z.y,12);addFloatText(z.x,z.y-20,'-'+dmg,'#f88');}});if(B.alive){const d=B.x-P.x,e=B.y-P.y;if(Math.sqrt(d*d+e*e)<rng){B.hp-=dmg*2;B.hitFlash=6;}}explosions.push({x:P.x,y:P.y,r:rng,life:1,dec:.02,col:'#88f'});addShake(10,200);sndExplosion();}
  if(i===1){const dur=3500+sk.lv*1200,dpt=6+sk.lv*4;for(let j=0;j<25;j++){const a=Math.random()*Math.PI*2,r=40+Math.random()*110;flames.push({x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,life:1,dec:1/(dur/16),dmg:dpt,r:25+Math.random()*15});}}
  if(i===2){P.shield=true;P.inv=3500+sk.lv*2200;setTimeout(()=>{P.shield=false;},3500+sk.lv*2200);}
  if(i===3){const dur=4500+sk.lv*2200;P.spdBoost=P.spd*1.9;setTimeout(()=>{P.spdBoost=0;},dur);}
}

function showStory(k){
  const s=STORIES[k];if(!s)return;G.state='story';
  document.getElementById('s-pt').textContent=s.p;
  document.getElementById('s-tl').textContent=s.t;
  document.getElementById('s-tx').innerHTML=s.x;
  document.getElementById('sp').style.display='flex';
  document.getElementById('s-bn').textContent=k==='win'?'重新游戏':'继续战斗';
  document.getElementById('s-bn').onclick=k==='win'?()=>location.reload():closeStory;
}
function closeStory(){G.state='playing';document.getElementById('sp').style.display='none';}

// ===== SHOP =====
function openShop(){G.state='shop';renderShop();document.getElementById('shp').style.display='flex';}
function closeShop(){G.state='playing';document.getElementById('shp').style.display='none';}
function renderShop(){
  document.getElementById('shp-c').textContent='🪙 金币: '+G.coins;
  const g=document.getElementById('shp-g');g.innerHTML='';
  SHOP.forEach(it=>{
    const cost=Math.floor(it.bc*Math.pow(1.5,it.lv));
    const mx=it.lv>=it.mx,cf=G.coins>=cost;
    const uw=(it.id==='w1'&&WPNS[1].unlocked)||(it.id==='w2'&&WPNS[2].unlocked);
    const dis=mx||!cf||uw;
    const d=document.createElement('div');d.className='si'+(dis?' dis':'');
    d.innerHTML=`<h3>${it.icon} ${it.name} <span class="lv">Lv${it.lv}/${it.mx===99?'∞':it.mx}</span></h3><p>${it.desc}</p><span class="pr">💰 ${mx?'已满级':uw?'已解锁':cost}</span>`;
    if(!dis)d.onclick=()=>buyItem(it.id);
    g.appendChild(d);
  });
}
function buyItem(id){
  const it=SHOP.find(i=>i.id===id);const cost=Math.floor(it.bc*Math.pow(1.5,it.lv));if(G.coins<cost)return;
  G.coins-=cost;it.lv++;sndCoin();
  if(id==='hp'){P.mhp+=30;P.hp=Math.min(P.hp+30,P.mhp);}
  if(id==='spd')P.spd+=.5;
  if(id==='w1'){WPNS[1].unlocked=true;updWpn();}
  if(id==='w2'){WPNS[2].unlocked=true;updWpn();}
  if(id==='wdmg')WPNS.forEach(w=>w.dmg=Math.floor(w.dmg*1.25));
  if(id==='s0')SKS[0].lv++;if(id==='s1')SKS[1].lv++;if(id==='s2')SKS[2].lv++;if(id==='s3')SKS[3].lv++;
  if(id==='heal'){P.hp=Math.min(P.hp+50,P.mhp);}
  renderShop();updHP();
}

// ===== UI =====
function updHP(){
  const p=P.hp/P.mhp*100;
  document.getElementById('hp-fill').style.width=p+'%';
  document.getElementById('hp-text').textContent=Math.ceil(P.hp);
  const f=document.getElementById('hp-fill');
  f.style.background=p>50?'linear-gradient(180deg,#f44,#c00)':p>25?'linear-gradient(180deg,#f80,#a40)':'linear-gradient(180deg,#f00,#800)';
}
function updSkills(now){
  SKS.forEach((sk,i)=>{
    const el=document.getElementById('sk'+i);
    const rem=Math.max(0,sk.cd-(now-sk.last));
    let cd=el.querySelector('.cd');
    if(rem>0){if(!cd){cd=document.createElement('div');cd.className='cd';el.appendChild(cd);}cd.textContent=(rem/1000).toFixed(1);el.classList.remove('ready');}
    else{if(cd)cd.remove();el.classList.add('ready');}
  });
}
function updWpn(){
  WPNS.forEach((w,i)=>{
    const el=document.getElementById('w'+i);
    el.classList.toggle('act',i===P.wpn);
    document.getElementById('w'+i+'n').textContent=w.unlocked?`${w.name} Lv${w.lv}`:`${w.name}`;
  });
}
function updUI(){
  document.getElementById('coins-d').textContent='🪙 '+G.coins;
  document.getElementById('score').textContent='得分: '+G.score;
  document.getElementById('wave-lbl').textContent='第'+G.wave+'波';
}

// ===== MAIN LOOP =====
let lt=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lt,50);lt=ts;G.time=ts;
  if(G.state==='playing')update(ts,dt);
  render(ts);updSkills(ts);
}

function update(now,dt){
  const spd=P.spdBoost||P.spd;
  let dx=0,dy=0;
  if(G.keys['w']||G.keys['arrowup'])dy=-1;
  if(G.keys['s']||G.keys['arrowdown'])dy=1;
  if(G.keys['a']||G.keys['arrowleft'])dx=-1;
  if(G.keys['d']||G.keys['arrowright'])dx=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  P.x+=dx*spd;P.y+=dy*spd;
  P.x=Math.max(P.r,Math.min(WW-P.r,P.x));
  P.y=Math.max(P.r,Math.min(WH-P.r,P.y));
  if(dx||dy)P.walkCycle+=dt*.008;

  G.cam.x=P.x-W/2;G.cam.y=P.y-H/2;
  G.cam.x=Math.max(0,Math.min(WW-W,G.cam.x));
  G.cam.y=Math.max(0,Math.min(WH-H,G.cam.y));
  if(G.shake.t>0){G.shake.t-=dt;const i=G.shake.intensity*(G.shake.t/300);G.shake.x=(Math.random()-.5)*i;G.shake.y=(Math.random()-.5)*i;}
  else{G.shake.x=0;G.shake.y=0;}

  if(G.mouse.down)shoot(now);

  if(zSpawned<zThisWave){wvTmr+=dt;if(wvTmr>500){wvTmr=0;spawnZ();}}

  const amx=G.mouse.x+G.cam.x+G.shake.x,amy=G.mouse.y+G.cam.y+G.shake.y;
  P.angle=Math.atan2(amy-P.y,amx-P.x);

  // Rose proximity notifications
  if(G.wave>=4&&!G.bossDown){
    const cageX=WW*0.82,cageY=WH*0.82;
    const distToCage=Math.sqrt((P.x-cageX)**2+(P.y-cageY)**2);
    if(distToCage<600&&Math.random()<.002){
      const msgs=['🌹 "……你来了吗……"','🌹 "坚持住……我还在……"','🌹 "……好冷……"','🌹 "我好想你……"'];
      showRoseNotify(msgs[Math.floor(Math.random()*msgs.length)]);
    }
  }

  bullets=bullets.filter(b=>{
    b.trailPts.push({x:b.x,y:b.y});if(b.trailPts.length>6)b.trailPts.shift();
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<0||b.x>WW||b.y<0||b.y>WH){if(b.explosive)spawnExplosion(b.x,b.y,110);return false;}
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i],d=z.x-b.x,e=z.y-b.y;
      if(d*d+e*e<(z.r+b.r)**2){if(b.explosive){spawnExplosion(b.x,b.y,130);return false;}z.hp-=b.dmg;z.hitFlash=4;spawnBlood(z.x,z.y,6);sndHit();addFloatText(z.x,z.y-z.r-8,'-'+b.dmg,'#ff8');return false;}
    }
    if(B.alive){const d=B.x-b.x,e=B.y-b.y;if(d*d+e*e<(B.r+b.r)**2){if(b.explosive){spawnExplosion(b.x,b.y,130);return false;}B.hp-=b.dmg;B.hitFlash=4;spawnBlood(B.x,B.y,4);sndHit();return false;}}
    return true;
  });

  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];
    if(z.hp<=0){
      spawnBlood(z.x,z.y,18,5);
      const pts=z.type==='elite'?30:z.type==='fast'?15:10;
      const cns=z.type==='elite'?25:z.type==='fast'?10:8;
      G.score+=pts;G.coins+=cns;G.killed++;
      if(G.wave>=G.rescueWave)G.rescueKills++;
      addFloatText(z.x,z.y-z.r-12,'+'+cns,'#fc0');
      sndDeath();zombies.splice(i,1);continue;
    }
    const d=P.x-z.x,e=P.y-z.y,dist=Math.sqrt(d*d+e*e)||1;
    z.angle=Math.atan2(e,d);z.x+=d/dist*z.spd;z.y+=e/dist*z.spd;
    z.wobble+=dt*.005;z.limbPhase+=dt*.006*z.spd;
    if(z.burning>0){z.hp-=4*dt/16;z.burning-=dt;}
    if(z.hitFlash>0)z.hitFlash--;
    if(dist<P.r+z.r+4){
      if(P.inv>0){P.inv-=dt;}
      else{P.hp-=z.dmg*(dt/1000)*4;
        document.getElementById('dmg-flash').style.opacity='1';
        setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',80);
        addShake(4,80);
        if(P.hp<=0){P.hp=0;gameDead();return;}
      }
    }
    updHP();
  }

  flames=flames.filter(f=>{f.life-=f.dec;if(f.life<=0)return false;zombies.forEach(z=>{const d=z.x-f.x,e=z.y-f.y;if(d*d+e*e<f.r**2){z.hp-=f.dmg*(dt/1000)*3;z.burning=600;z.hitFlash=2;}});if(B.alive){const d=B.x-f.x,e=B.y-f.y;if(d*d+e*e<f.r**2)B.hp-=f.dmg*(dt/1000)*4;}return true;});

  if(B.alive){
    if(B.hp<B.mhp*.5&&B.phase===1){B.phase=2;B.spd*=1.4;addShake(15,300);}
    const bd=P.x-B.x,be=P.y-B.y,bd2=Math.sqrt(bd*bd+be*be)||1;
    if(!B.charging){B.x+=bd/bd2*B.spd;B.y+=be/bd2*B.spd;}
    B.chgTmr+=dt;
    if(!B.charging&&B.chgTmr>2500){B.charging=true;B.chgTmr=0;B.cdx=bd/bd2*10;B.cdy=be/bd2*10;setTimeout(()=>{B.charging=false;},500);}
    if(B.charging){B.x+=B.cdx;B.y+=B.cdy;}
    B.x=Math.max(0,Math.min(WW,B.x));B.y=Math.max(0,Math.min(WH,B.y));
    const bp=P.x-B.x,bq=P.y-B.y,bpr=Math.sqrt(bp*bp+bq*bq)||1;
    if(bpr<P.r+B.r+5&&P.inv<=0&&!P.shield){P.hp-=35*(dt/1000)*4;addShake(8,120);document.getElementById('dmg-flash').style.opacity='1';setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',100);if(P.hp<=0){P.hp=0;gameDead();return;}updHP();}
    if(B.phase===2){B.atkTmr+=dt;
      if(B.atkTmr>1200){B.atkTmr=0;for(let a=0;a<10;a++){const ang=(a/10)*Math.PI*2;bullets.push({x:B.x,y:B.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5,dmg:18,col:'#f04',trail:'#a02',life:1,r:5,isBoss:true,explosive:false,trailPts:[]});}sndShoot();}
      B.spawnTmr+=dt;if(B.spawnTmr>4000&&zombies.length<15){B.spawnTmr=0;for(let j=0;j<2;j++){const a=Math.random()*Math.PI*2;zombies.push({x:B.x+Math.cos(a)*80,y:B.y+Math.sin(a)*80,hp:30,mhp:30,spd:1+Math.random()*.5,r:18,type:'normal',dmg:8,burning:0,hitFlash:0,angle:0,wobble:Math.random()*1000,limbPhase:0});}}
    }
    if(B.hitFlash>0)B.hitFlash--;
    if(B.hp<=0){B.alive=false;G.bossDown=true;document.getElementById('bb').style.display='none';spawnExplosion(B.x,B.y,220);spawnBlood(B.x,B.y,50,8);G.coins+=600;G.score+=1500;addFloatText(B.x,B.y-60,'+600','#fc0');setTimeout(()=>showStory('win'),900);}
    document.getElementById('bb-f').style.width=(B.hp/B.mhp*100)+'%';
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];if(!b.isBoss)continue;
    const d=P.x-b.x,e=P.y-b.y;
    if(d*d+e*e<(P.r+b.r)**2){if(!P.shield&&P.inv<=0){P.hp-=b.dmg;updHP();document.getElementById('dmg-flash').style.opacity='1';setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',80);if(P.hp<=0){P.hp=0;gameDead();return;}}bullets.splice(i,1);}
  }

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(p.gravity){p.vy+=p.gravity;}p.vx*=.96;p.vy*=.96;p.life-=p.dec;return p.life>0;});
  explosions=explosions.filter(e=>{e.life-=e.dec;return e.life>0;});
  floatingTexts=floatingTexts.filter(f=>{f.y+=f.vy;f.life-=.02;return f.life>0;});

  if(zSpawned>=zThisWave&&zombies.length===0&&!B.alive){
    if(G.wave>=G.maxWave){if(!G.bossUp)spawnBoss();}
    else{
      G.wave++;updUI();
      G.coins+=30+G.wave*12;sndWave();announceWave(G.wave);
      if(G.wave===2)showStory('wave2');
      else if(G.wave===3)showStory('wave3');
      else if(G.wave===G.rescueWave)showStory('wave5');
      openShop();spawnWave(G.wave);
    }
  }

  if(G.wave>=G.rescueWave){document.getElementById('rb').style.display='block';document.getElementById('rp').textContent=Math.min(100,Math.floor(G.rescueKills/Math.max(1,G.rescueTarget)*100));}
  updUI();
}

function announceWave(w){const el=document.getElementById('wave-ann');el.textContent='⚔️ 第 '+w+' 波 ⚔️';el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);}

// ===== RENDER =====
function render(now){
  cx.clearRect(0,0,W,H);cx.save();
  cx.translate(-G.cam.x+G.shake.x,-G.cam.y+G.shake.y);

  const mmx=G.cam.x+W-125,mmy=G.cam.y+10;const mmw=115,mmh=85,scx2=mmw/WW,scy2=mmh/WH;
  cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(mmx,mmy,mmw,mmh);cx.strokeStyle='#333';cx.lineWidth=1;cx.strokeRect(mmx,mmy,mmw,mmh);
  cx.strokeStyle='rgba(100,150,255,0.3)';cx.strokeRect(mmx+G.cam.x*scx2,mmy+G.cam.y*scy2,W*scx2,H*scy2);
  cx.fillStyle='#4af';cx.fillRect(mmx+px*scx2-2,mmy+py*scy2-2,4,4);
  // Rose on minimap
  cx.fillStyle='#f9a';cx.fillRect(mmx+WW*.82*scx2-3,mmy+WH*.82*scy2-3,6,6);
  cx.fillStyle='#f44';zombies.forEach(z=>cx.fillRect(mmx+z.x*scx2,mmy+z.y*scy2,2,2));
  if(B.alive){cx.fillStyle='#f0f';cx.fillRect(mmx+B.x*scx2-3,mmy+B.y*scy2-3,6,6);}

  cx.restore();
}

// ===== INPUT =====
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();G.keys[k]=true;
  if(G.state==='playing'){
    if(k==='q')useSkill(0,performance.now());
    if(k==='e')useSkill(1,performance.now());
    if(k==='r')useSkill(2,performance.now());
    if(k==='f')useSkill(3,performance.now());
    if(k==='1')switchWpn(0);if(k==='2')switchWpn(1);if(k==='3')switchWpn(2);
    if(k==='tab'){e.preventDefault();openShop();}
  }
  if(G.state==='shop'&&k==='tab'){e.preventDefault();closeShop();}
});
window.addEventListener('keyup',e=>G.keys[e.key.toLowerCase()]=false);
window.addEventListener('mousemove',e=>{G.mouse.x=e.clientX;G.mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{if(e.button===0){G.mouse.down=true;if(AC.state==='suspended')AC.resume();}});
window.addEventListener('mouseup',e=>{if(e.button===0)G.mouse.down=false;});
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('wheel',e=>{
  if(G.state!=='playing')return;
  const dir=e.deltaY>0?1:-1;let nw=(P.wpn+dir+3)%3,tries=0;
  while(!WPNS[nw].unlocked&&tries<3){nw=(nw+dir+3)%3;tries++;}
  if(WPNS[nw].unlocked)switchWpn(nw);
});
// basic touch for mobile testing
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];G.mouse.x=t.clientX;G.mouse.y=t.clientY;G.mouse.down=true;if(AC.state==='suspended')AC.resume();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];G.mouse.x=t.clientX;G.mouse.y=t.clientY;},{passive:false});
cv.addEventListener('touchend',e=>{G.mouse.down=false;});

function switchWpn(i){if(!WPNS[i].unlocked)return;P.wpn=i;updWpn();}

// ===== GAME FLOW =====
function startGame(){
  document.getElementById('overlay').style.display='none';
  G.state='playing';spawnWave(1);
  requestAnimationFrame(loop);
  showStory('start');
}
function gameDead(){
  G.state='dead';sndDeath();
  const ov=document.getElementById('overlay');
  ov.querySelector('h1').textContent='💀 你倒下了';
  ov.querySelector('.sub').innerHTML=`得分: ${G.score}  击杀: ${G.killed}<br>🌹 玫瑰还在等你……`;
  ov.querySelector('button').textContent='重新挑战';
  ov.querySelector('button').onclick=()=>location.reload();
  ov.style.display='flex';
}

// ===== INIT =====
cx.fillStyle='#000';cx.fillRect(0,0,W,H);
updWpn();updHP();
